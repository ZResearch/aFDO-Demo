<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aFDO Registry Monitor</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .graph-area {
            flex: 1;
            position: relative;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        }

        .sidebar {
            width: 380px;
            background: #1e293b;
            border-left: 1px solid #334155;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            padding: 24px;
            border-bottom: 1px solid #1e40af;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 6px;
            color: white;
            letter-spacing: -0.025em;
        }

        .header p {
            font-size: 12px;
            opacity: 0.9;
            color: white;
            font-weight: 400;
        }

        .stats {
            padding: 20px;
            background: #0f172a;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            border-bottom: 1px solid #334155;
        }

        .stat {
            text-align: center;
            padding: 14px;
            background: #1e293b;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 600;
            color: #3b82f6;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 500;
        }

        .events-header {
            padding: 16px 20px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
        }

        .events-header h2 {
            font-size: 14px;
            font-weight: 600;
            color: #e2e8f0;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .events {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .event {
            padding: 12px 14px;
            margin-bottom: 10px;
            background: #0f172a;
            border-radius: 6px;
            border-left: 3px solid #3b82f6;
            font-size: 12px;
            animation: slideIn 0.3s ease-out;
            border: 1px solid #334155;
        }

        @keyframes slideIn {
            from {
                transform: translateX(20px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .event-time {
            color: #64748b;
            font-size: 10px;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .event-type {
            font-weight: 600;
            color: #3b82f6;
            margin-bottom: 4px;
        }

        .event-details {
            color: #94a3b8;
            font-size: 11px;
            line-height: 1.5;
        }

        .event.discovery-request {
            border-left-color: #f59e0b;
        }

        .event.call-made {
            border-left-color: #ef4444;
        }

        .event.fdo-registered {
            border-left-color: #10b981;
        }

        .legend {
            padding: 16px 20px;
            background: #0f172a;
            border-top: 1px solid #334155;
        }

        .legend-title {
            font-size: 11px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            font-size: 11px;
            color: #cbd5e1;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            margin-right: 10px;
        }

        .node {
            cursor: pointer;
        }

        .node circle {
            stroke: #fff;
            stroke-width: 2.5px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }

        .node text {
            font-size: 11px;
            fill: #e2e8f0;
            text-anchor: middle;
            pointer-events: none;
            font-weight: 500;
        }

        .link {
            stroke: #475569;
            stroke-opacity: 0.4;
            stroke-width: 1.5px;
        }

        .link.active {
            stroke: #ef4444;
            stroke-width: 3px;
            stroke-opacity: 0.8;
            animation: pulse 2s infinite;
        }

        .link.discovery {
            stroke: #f59e0b;
            stroke-dasharray: 5,5;
            stroke-width: 2px;
            stroke-opacity: 0.6;
        }

        .connection-status {
            position: absolute;
            top: 24px;
            right: 24px;
            padding: 10px 16px;
            background: #1e293b;
            border-radius: 6px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #334155;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
        }

        .connection-status.connected {
            border-color: #10b981;
        }

        .connection-status.connected .status-dot {
            background: #10b981;
            animation: pulse 2s infinite;
        }

        .connection-status.disconnected {
            border-color: #ef4444;
        }

        .connection-status.disconnected .status-dot {
            background: #ef4444;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f172a;
        }

        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        /* Graph Title */
        .graph-title {
            position: absolute;
            top: 24px;
            left: 24px;
            background: rgba(30, 41, 59, 0.9);
            padding: 12px 18px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            color: #e2e8f0;
            border: 1px solid #334155;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="graph-area">
            <div class="graph-title">Network Topology</div>
            <div class="connection-status disconnected" id="connectionStatus">
                <div class="status-dot"></div>
                <span>Connecting to registry...</span>
            </div>
            <svg id="graph"></svg>
        </div>

        <div class="sidebar">
            <div class="header">
                <h1>aFDO Registry Monitor</h1>
                <p>Real-time Agent Activity Dashboard</p>
            </div>

            <div class="stats">
                <div class="stat">
                    <div class="stat-value" id="fdoCount">0</div>
                    <div class="stat-label">Agents</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="operationCount">0</div>
                    <div class="stat-label">Operations</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="eventCount">0</div>
                    <div class="stat-label">Events</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="activeJobs">0</div>
                    <div class="stat-label">Active Jobs</div>
                </div>
            </div>

            <div class="events-header">
                <h2>Activity Stream</h2>
            </div>

            <div class="events" id="events">
                <div class="event">
                    <div class="event-time">System initialized</div>
                    <div class="event-details">Waiting for agent activity...</div>
                </div>
            </div>

            <div class="legend">
                <div class="legend-title">Event Types</div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #3b82f6;"></div>
                    <span>Agent Registration</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #f59e0b;"></div>
                    <span>Discovery Request</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #ef4444;"></div>
                    <span>Agent Call</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #10b981;"></div>
                    <span>FDO Registration</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const width = document.querySelector('.graph-area').offsetWidth;
        const height = document.querySelector('.graph-area').offsetHeight;

        const svg = d3.select('#graph')
            .attr('width', width)
            .attr('height', height);

        const simulation = d3.forceSimulation()
            .force('link', d3.forceLink().id(d => d.id).distance(150))
            .force('charge', d3.forceManyBody().strength(-400))
            .force('center', d3.forceCenter(width / 2, height / 2))
            .force('collision', d3.forceCollide().radius(60));

        let nodes = [];
        let links = [];
        let linkElements, nodeElements, textElements;

        const nodeColorMap = {
            'user-interface-v1': '#3b82f6',
            'fact-checker-v1': '#8b5cf6',
            'data-source-v1': '#10b981',
            'llm-endpoint-v1': '#f59e0b',
            'orchestrator-v1': '#ec4899',
            'parser-v1': '#06b6d4'
        };

        function getNodeColor(node) {
            const type = node.fdo_type_pid ? node.fdo_type_pid.split('-').pop() : 'default';
            return nodeColorMap[type] || '#64748b';
        }

        function updateGraph() {
            linkElements = svg.selectAll('.link')
                .data(links, d => `${d.source.id}-${d.target.id}`)
                .join('line')
                .attr('class', 'link');

            nodeElements = svg.selectAll('.node')
                .data(nodes, d => d.id)
                .join('g')
                .attr('class', 'node')
                .call(d3.drag()
                    .on('start', dragstarted)
                    .on('drag', dragged)
                    .on('end', dragended));

            nodeElements.selectAll('circle').remove();
            nodeElements.append('circle')
                .attr('r', 20)
                .attr('fill', d => getNodeColor(d));

            nodeElements.selectAll('text').remove();
            nodeElements.append('text')
                .attr('dy', 35)
                .text(d => {
                    const name = d.name || d.id;
                    return name.length > 15 ? name.substring(0, 12) + '...' : name;
                });

            simulation.nodes(nodes);
            simulation.force('link').links(links);
            simulation.alpha(0.3).restart();
        }

        simulation.on('tick', () => {
            if (linkElements) {
                linkElements
                    .attr('x1', d => d.source.x)
                    .attr('y1', d => d.source.y)
                    .attr('x2', d => d.target.x)
                    .attr('y2', d => d.target.y);
            }

            if (nodeElements) {
                nodeElements.attr('transform', d => `translate(${d.x},${d.y})`);
            }
        });

        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }

        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }

        function addEvent(type, details) {
            const eventsDiv = document.getElementById('events');
            const event = document.createElement('div');
            event.className = `event ${type}`;

            const time = new Date().toLocaleTimeString();
            event.innerHTML = `
                <div class="event-time">${time}</div>
                <div class="event-type">${type.replace('-', ' ').toUpperCase()}</div>
                <div class="event-details">${details}</div>
            `;

            eventsDiv.insertBefore(event, eventsDiv.firstChild);

            if (eventsDiv.children.length > 50) {
                eventsDiv.removeChild(eventsDiv.lastChild);
            }

            const eventCount = document.getElementById('eventCount');
            eventCount.textContent = parseInt(eventCount.textContent) + 1;
        }

        async function fetchAgents() {
            try {
                const response = await fetch('http://localhost:8000/fdo');
                const data = await response.json();

                document.getElementById('fdoCount').textContent = data.length;

                const existingIds = new Set(nodes.map(n => n.id));
                data.forEach(fdo => {
                    if (!existingIds.has(fdo.pid)) {
                        nodes.push({
                            id: fdo.pid,
                            name: fdo.self_description?.agent_info?.name || fdo.pid,
                            fdo_type_pid: fdo.fdo_type_pid,
                            x: width / 2 + (Math.random() - 0.5) * 200,
                            y: height / 2 + (Math.random() - 0.5) * 200
                        });
                        addEvent('fdo-registered', `New agent: ${fdo.self_description?.agent_info?.name || fdo.pid}`);
                    }
                });

                updateGraph();

                const statusDiv = document.getElementById('connectionStatus');
                statusDiv.className = 'connection-status connected';
                statusDiv.innerHTML = '<div class="status-dot"></div><span>Connected to Registry</span>';

            } catch (error) {
                console.error('Failed to fetch agents:', error);
                const statusDiv = document.getElementById('connectionStatus');
                statusDiv.className = 'connection-status disconnected';
                statusDiv.innerHTML = '<div class="status-dot"></div><span>Connection Failed</span>';
            }
        }

        async function fetchOperations() {
            try {
                const response = await fetch('http://localhost:8000/operation');
                const data = await response.json();
                document.getElementById('operationCount').textContent = data.length;
            } catch (error) {
                console.error('Failed to fetch operations:', error);
            }
        }

        // Initialize
        fetchAgents();
        fetchOperations();

        // Refresh every 5 seconds
        setInterval(() => {
            fetchAgents();
            fetchOperations();
        }, 5000);

        // Simulate some activity for demo
        setInterval(() => {
            if (Math.random() > 0.7 && nodes.length > 1) {
                const from = nodes[Math.floor(Math.random() * nodes.length)];
                const to = nodes[Math.floor(Math.random() * nodes.length)];
                if (from !== to) {
                    addEvent('call-made', `${from.name} → ${to.name}`);
                }
            }
        }, 8000);
    </script>
</body>
</html>
